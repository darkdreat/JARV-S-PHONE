          cat > polat/app/src/main/java/com/polat/ai/Prefs.kt <<'EOF'
          package com.polat.ai

          import android.content.Context

          class Prefs(ctx: Context) {
              private val sp = ctx.getSharedPreferences("polat", Context.MODE_PRIVATE)

              private fun s(k: String): String = sp.getString(k, "") ?: ""
              private fun put(k: String, v: String) { sp.edit().putString(k, v).apply() }
              private fun putF(k: String, v: Float) { sp.edit().putFloat(k, v).apply() }

              var groqKey: String
                  get() = s("groq")
                  set(v) { put("groq", v.trim()) }
              var elKey: String
                  get() = s("elKey")
                  set(v) { put("elKey", v.trim()) }
              var elVoice: String
                  get() = s("elVoice")
                  set(v) { put("elVoice", v.trim()) }
              var voiceName: String
                  get() = s("voiceName")
                  set(v) { put("voiceName", v) }
              var lore: String
                  get() = s("lore")
                  set(v) { put("lore", v) }
              var useEl: Boolean
                  get() = sp.getBoolean("useEl", false)
                  set(v) { sp.edit().putBoolean("useEl", v).apply() }
              var mouthY: Float
                  get() = sp.getFloat("mouthY", 0.32f)
                  set(v) { putF("mouthY", v) }
              var mouthX: Float
                  get() = sp.getFloat("mouthX", 0.5f)
                  set(v) { putF("mouthX", v) }
              var mouthW: Float
                  get() = sp.getFloat("mouthW", 0.2f)
                  set(v) { putF("mouthW", v) }
              var jaw: Float
                  get() = sp.getFloat("jaw", 0.05f)
                  set(v) { putF("jaw", v) }
          }
          EOF

          cat > polat/app/src/main/java/com/polat/ai/Avatar.kt <<'EOF'
          package com.polat.ai

          import android.content.Context
          import android.graphics.Bitmap
          import android.graphics.BitmapFactory
          import android.net.Uri
          import androidx.compose.foundation.Canvas
          import androidx.compose.material3.MaterialTheme
          import androidx.compose.material3.Slider
          import androidx.compose.material3.Text
          import androidx.compose.runtime.Composable
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.geometry.Offset
          import androidx.compose.ui.geometry.Size
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.graphics.ImageBitmap
          import androidx.compose.ui.graphics.asImageBitmap
          import androidx.compose.ui.unit.IntOffset
          import androidx.compose.ui.unit.IntSize
          import java.io.File
          import java.io.FileOutputStream

          // Kullanicinin galeriden sectigi resmi uygulama hafizasina kopyalar (APK'nin icinde resim yok).
          fun saveAvatar(ctx: Context, uri: Uri): Boolean {
              return try {
                  val bounds = BitmapFactory.Options().apply { inJustDecodeBounds = true }
                  ctx.contentResolver.openInputStream(uri)?.use { BitmapFactory.decodeStream(it, null, bounds) }
                  var sample = 1
                  while (bounds.outWidth / sample > 1600 || bounds.outHeight / sample > 1600) sample *= 2
                  val opts = BitmapFactory.Options().apply { inSampleSize = sample }
                  val bmp = ctx.contentResolver.openInputStream(uri)?.use { BitmapFactory.decodeStream(it, null, opts) }
                      ?: return false
                  FileOutputStream(File(ctx.filesDir, "avatar.png")).use { bmp.compress(Bitmap.CompressFormat.PNG, 100, it) }
                  true
              } catch (e: Exception) {
                  false
              }
          }

          fun readAvatar(ctx: Context): ImageBitmap? {
              val f = File(ctx.filesDir, "avatar.png")
              if (!f.exists()) return null
              return BitmapFactory.decodeFile(f.path)?.asImageBitmap()
          }

          // Resmi agiz cizgisinden ikiye boler; alt kisim "open" kadar asagi kayar, arada koyu agiz acilir.
          @Composable
          fun TalkingAvatar(
              img: ImageBitmap?,
              open: Float,
              mouthY: Float,
              mouthX: Float,
              mouthW: Float,
              jaw: Float,
              modifier: Modifier = Modifier
          ) {
              Canvas(modifier) {
                  if (img == null) {
                      // Resim secilmediyse basit, orijinal bir yuz cizilir
                      val cx = size.width / 2f
                      val cy = size.height / 2f
                      val r = minOf(size.width, size.height) * 0.35f
                      drawCircle(Color(0xFFC8A27A), r, Offset(cx, cy))
                      drawCircle(Color(0xFF111111), r * 0.07f, Offset(cx - r * 0.35f, cy - r * 0.2f))
                      drawCircle(Color(0xFF111111), r * 0.07f, Offset(cx + r * 0.35f, cy - r * 0.2f))
                      drawOval(Color(0xFF5A1010), Offset(cx - r * 0.3f, cy + r * 0.35f), Size(r * 0.6f, r * 0.08f + r * 0.35f * open))
                      return@Canvas
                  }
                  val scale = minOf(size.width / img.width, size.height / img.height)
                  val iw = (img.width * scale).toInt()
                  val ih = (img.height * scale).toInt()
                  val left = ((size.width - iw) / 2f).toInt()
                  val top = ((size.height - ih) / 2f).toInt()
                  val splitSrc = (img.height * mouthY).toInt().coerceIn(1, img.height - 1)
                  val upH = (ih * mouthY).toInt().coerceIn(1, ih - 1)
                  val dy = (open * jaw * ih).toInt()

                  drawImage(
                      image = img,
                      srcOffset = IntOffset(0, 0),
                      srcSize = IntSize(img.width, splitSrc),
                      dstOffset = IntOffset(left, top),
                      dstSize = IntSize(iw, upH)
                  )
                  if (dy > 0) {
                      // bosluk: kesim cizgisindeki tek piksellik satir gerilerek deri rengiyle doldurulur
                      drawImage(
                          image = img,
                          srcOffset = IntOffset(0, splitSrc - 1),
                          srcSize = IntSize(img.width, 1),
                          dstOffset = IntOffset(left, top + upH),
                          dstSize = IntSize(iw, dy)
                      )
                      val mw = mouthW * iw
                      drawOval(
                          Color(0xFF3B0A0A),
                          Offset(left + mouthX * iw - mw / 2f, (top + upH).toFloat()),
                          Size(mw, dy.toFloat())
                      )
                  }
                  drawImage(
                      image = img,
                      srcOffset = IntOffset(0, splitSrc),
                      srcSize = IntSize(img.width, img.height - splitSrc),
                      dstOffset = IntOffset(left, top + upH + dy),
                      dstSize = IntSize(iw, ih - upH)
                  )
              }
          }

          @Composable
          fun LabeledSlider(label: String, value: Float, range: ClosedFloatingPointRange<Float>, onChange: (Float) -> Unit) {
              Text(label, color = Color.Gray, style = MaterialTheme.typography.labelSmall)
              Slider(value = value, onValueChange = onChange, valueRange = range)
          }
          EOF

          cat > polat/app/src/main/java/com/polat/ai/MainActivity.kt <<'EOF'
          package com.polat.ai

          import android.app.Activity
          import android.content.Intent
          import android.media.MediaPlayer
          import android.os.Bundle
          import android.speech.RecognizerIntent
          import android.speech.tts.TextToSpeech
          import android.speech.tts.UtteranceProgressListener
          import android.widget.Toast
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.rememberLauncherForActivityResult
          import androidx.activity.compose.setContent
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.compose.animation.core.animateFloatAsState
          import androidx.compose.animation.core.tween
          import androidx.compose.foundation.background
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.LazyColumn
          import androidx.compose.foundation.lazy.rememberLazyListState
          import androidx.compose.foundation.rememberScrollState
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.foundation.verticalScroll
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.text.input.PasswordVisualTransformation
          import androidx.compose.ui.unit.dp
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.delay
          import kotlinx.coroutines.launch
          import kotlinx.coroutines.withContext
          import org.json.JSONArray
          import org.json.JSONObject
          import java.io.File
          import java.net.HttpURLConnection
          import java.net.URL
          import java.util.Locale
          import kotlin.random.Random

          class MainActivity : ComponentActivity() {
              private var tts: TextToSpeech? = null
              private var player: MediaPlayer? = null
              private var talking by mutableStateOf(false)
              private var voices by mutableStateOf<List<String>>(emptyList())
              private var elErr = ""
              private val prefs by lazy { Prefs(this) }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  tts = TextToSpeech(this) { status ->
                      if (status == TextToSpeech.SUCCESS) {
                          tts?.language = Locale("tr", "TR")
                          tts?.setOnUtteranceProgressListener(object : UtteranceProgressListener() {
                              override fun onStart(utteranceId: String?) { talking = true }
                              override fun onDone(utteranceId: String?) { talking = false }
                              override fun onError(utteranceId: String?) { talking = false }
                          })
                          val all = tts?.voices ?: emptySet()
                          voices = all.filter { it.locale.language == "tr" }.map { it.name }.sorted()
                          applyVoice(prefs.voiceName)
                      }
                  }
                  setContent { MaterialTheme(colorScheme = darkColorScheme()) { Root() } }
              }

              override fun onDestroy() {
                  stopSpeaking()
                  tts?.shutdown()
                  super.onDestroy()
              }

              private fun applyVoice(name: String) {
                  if (name.isBlank()) return
                  val v = tts?.voices?.firstOrNull { it.name == name }
                  if (v != null) tts?.voice = v
              }

              private fun stopSpeaking() {
                  tts?.stop()
                  try { player?.release() } catch (e: Exception) { }
                  player = null
                  talking = false
              }

              private fun speakSystem(text: String, pitch: Float, rate: Float) {
                  tts?.stop()
                  tts?.setPitch(pitch)
                  tts?.setSpeechRate(rate)
                  talking = true
                  tts?.speak(text, TextToSpeech.QUEUE_FLUSH, null, "polat")
              }

              private fun elevenAudio(text: String): File? {
                  return try {
                      val url = "https://api.elevenlabs.io/v1/text-to-speech/" + prefs.elVoice + "?output_format=mp3_44100_64"
                      val c = URL(url).openConnection() as HttpURLConnection
                      c.requestMethod = "POST"
                      c.connectTimeout = 15000
                      c.readTimeout = 40000
                      c.doOutput = true
                      c.setRequestProperty("xi-api-key", prefs.elKey)
                      c.setRequestProperty("Content-Type", "application/json")
                      c.setRequestProperty("Accept", "audio/mpeg")
                      val body = JSONObject().put("text", text).put("model_id", "eleven_multilingual_v2")
                      c.outputStream.use { it.write(body.toString().toByteArray()) }
                      val code = c.responseCode
                      if (code !in 200..299) {
                          elErr = "HTTP " + code
                          return null
                      }
                      val f = File(cacheDir, "tts.mp3")
                      c.inputStream.use { i -> f.outputStream().use { o -> i.copyTo(o) } }
                      f
                  } catch (e: Exception) {
                      elErr = e.message ?: "baglanti yok"
                      null
                  }
              }

              private fun playFile(f: File) {
                  try {
                      val mp = MediaPlayer()
                      mp.setDataSource(f.path)
                      mp.setOnCompletionListener {
                          talking = false
                          it.release()
                          if (player === it) player = null
                      }
                      mp.prepare()
                      player = mp
                      talking = true
                      mp.start()
                  } catch (e: Exception) {
                      talking = false
                  }
              }

              // ElevenLabs acik ve ayarliysa onunla, olmazsa telefonun kendi sesiyle konusur
              private suspend fun say(text: String, pitch: Float, rate: Float) {
                  stopSpeaking()
                  if (prefs.useEl && prefs.elKey.isNotBlank() && prefs.elVoice.isNotBlank()) {
                      val f = withContext(Dispatchers.IO) { elevenAudio(text) }
                      if (f != null) {
                          playFile(f)
                          return
                      }
                      Toast.makeText(this, "ElevenLabs olmadı (" + elErr + "), telefon sesi kullanılıyor", Toast.LENGTH_LONG).show()
                  }
                  speakSystem(text, pitch, rate)
              }

              // Kullanicinin yapistirdigi bilgi notlarindan, soruyla en cok ortusen 2 paragrafi secer (token tasarrufu)
              private fun loreFor(q: String, lore: String): String {
                  if (lore.isBlank()) return ""
                  val tr = Locale("tr", "TR")
                  val words = q.lowercase(tr).split(Regex("[^\\p{L}0-9]+")).filter { it.length >= 4 }.map { it.take(6) }.toSet()
                  if (words.isEmpty()) return ""
                  val scored = lore.split(Regex("\n\\s*\n"))
                      .map { ch ->
                          val l = ch.lowercase(tr)
                          Pair(ch, words.count { l.contains(it) })
                      }
                      .filter { it.second > 0 }
                      .sortedByDescending { it.second }
                      .take(2)
                  return scored.joinToString("\n---\n") { it.first.take(900) }
              }

              // Once guclu model, kota/limit dolarsa hafif modele duser
              private fun ask(p: Persona, history: List<Pair<String, String>>, lore: String, key: String): String {
                  val models = listOf("llama-3.3-70b-versatile", "llama-3.1-8b-instant")
                  var err = "bilinmeyen hata"
                  val system = if (lore.isBlank()) p.prompt
                  else p.prompt + "\n\nBilgi notları (kullanıcının verdiği, öncelikli kaynak):\n" + lore
                  for (m in models) {
                      try {
                          val msgs = JSONArray()
                          msgs.put(JSONObject().put("role", "system").put("content", system))
                          history.takeLast(6).forEach {
                              msgs.put(JSONObject().put("role", it.first).put("content", it.second))
                          }
                          val body = JSONObject()
                              .put("model", m)
                              .put("max_tokens", 260)
                              .put("temperature", 0.8)
                              .put("messages", msgs)
                          val c = URL("https://api.groq.com/openai/v1/chat/completions")
                              .openConnection() as HttpURLConnection
                          c.requestMethod = "POST"
                          c.connectTimeout = 15000
                          c.readTimeout = 30000
                          c.doOutput = true
                          c.setRequestProperty("Content-Type", "application/json")
                          c.setRequestProperty("User-Agent", "PolatAI/1.0")
                          c.setRequestProperty("Authorization", "Bearer " + key)
                          c.outputStream.use { it.write(body.toString().toByteArray()) }
                          val code = c.responseCode
                          val stream = if (code in 200..299) c.inputStream else c.errorStream
                          val txt = stream.bufferedReader().readText()
                          if (code in 200..299) {
                              return JSONObject(txt).getJSONArray("choices").getJSONObject(0)
                                  .getJSONObject("message").getString("content").trim()
                          }
                          err = "Hata " + code
                          if (code != 429 && code != 413) break
                      } catch (e: Exception) {
                          err = e.message ?: "baglanti yok"
                          break
                      }
                  }
                  return "⚠ " + err
              }

              @Composable
              fun Root() {
                  val ctx = this@MainActivity
                  var screen by remember { mutableStateOf("main") }
                  var avatar by remember { mutableStateOf(readAvatar(ctx)) }
                  var mouthY by remember { mutableStateOf(prefs.mouthY) }
                  var mouthX by remember { mutableStateOf(prefs.mouthX) }
                  var mouthW by remember { mutableStateOf(prefs.mouthW) }
                  var jaw by remember { mutableStateOf(prefs.jaw) }
                  var testing by remember { mutableStateOf(false) }
                  var open by remember { mutableStateOf(0f) }
                  var persona by remember { mutableStateOf(Persona.POLAT) }
                  var pitch by remember(persona) { mutableStateOf(persona.pitch) }
                  var rate by remember(persona) { mutableStateOf(persona.rate) }
                  val msgs = remember { mutableStateListOf<Pair<String, String>>() }
                  var input by remember { mutableStateOf("") }
                  var busy by remember { mutableStateOf(false) }
                  var menu by remember { mutableStateOf(false) }
                  var gk by remember { mutableStateOf(prefs.groqKey) }
                  var ek by remember { mutableStateOf(prefs.elKey) }
                  var ev by remember { mutableStateOf(prefs.elVoice) }
                  var useEl by remember { mutableStateOf(prefs.useEl) }
                  var chosen by remember { mutableStateOf(prefs.voiceName) }
                  var lore by remember { mutableStateOf(prefs.lore) }
                  val scope = rememberCoroutineScope()
                  val list = rememberLazyListState()

                  val active = talking || testing
                  LaunchedEffect(active) {
                      if (active) {
                          while (true) {
                              open = 0.2f + Random.nextFloat() * 0.8f
                              delay(110)
                          }
                      } else {
                          open = 0f
                      }
                  }
                  val smooth by animateFloatAsState(open, tween(90), label = "jaw")

                  fun send(text: String) {
                      if (text.isBlank() || busy) return
                      msgs.add("user" to text)
                      input = ""
                      busy = true
                      val p = persona
                      val hist = msgs.toList()
                      val l = loreFor(text, prefs.lore)
                      val key = if (prefs.groqKey.isNotBlank()) prefs.groqKey else Vault.key()
                      scope.launch {
                          val r = withContext(Dispatchers.IO) { ask(p, hist, l, key) }
                          msgs.add("assistant" to r)
                          busy = false
                          if (!r.startsWith("⚠")) say(r, pitch, rate)
                          list.animateScrollToItem(msgs.size - 1)
                      }
                  }

                  val mic = rememberLauncherForActivityResult(ActivityResultContracts.StartActivityForResult()) { r ->
                      if (r.resultCode == Activity.RESULT_OK) {
                          r.data?.getStringArrayListExtra(RecognizerIntent.EXTRA_RESULTS)
                              ?.firstOrNull()?.let { send(it) }
                      }
                  }
                  val pick = rememberLauncherForActivityResult(ActivityResultContracts.GetContent()) { uri ->
                      if (uri != null) {
                          if (saveAvatar(ctx, uri)) avatar = readAvatar(ctx)
                          else Toast.makeText(ctx, "Resim açılamadı", Toast.LENGTH_SHORT).show()
                      }
                  }

                  Surface(modifier = Modifier.fillMaxSize(), color = Color(0xFF0B0B0B)) {
                      if (screen == "main") {
                          Column(
                              Modifier.fillMaxSize().statusBarsPadding().navigationBarsPadding().imePadding().padding(12.dp)
                          ) {
                              Row(Modifier.fillMaxWidth(), verticalAlignment = Alignment.CenterVertically) {
                                  Text(
                                      "POLAT AI", color = Color(0xFFC9A24B),
                                      style = MaterialTheme.typography.headlineSmall,
                                      modifier = Modifier.weight(1f)
                                  )
                                  Box {
                                      OutlinedButton(onClick = { menu = true }) { Text(persona.title + " ▾") }
                                      DropdownMenu(expanded = menu, onDismissRequest = { menu = false }) {
                                          Persona.values().forEach { p ->
                                              DropdownMenuItem(
                                                  text = { Text(p.title) },
                                                  onClick = { persona = p; menu = false }
                                              )
                                          }
                                      }
                                  }
                                  Spacer(Modifier.width(6.dp))
                                  OutlinedButton(onClick = { screen = "settings" }) { Text("⚙") }
                              }
                              TalkingAvatar(
                                  avatar, smooth, mouthY, mouthX, mouthW, jaw,
                                  Modifier.fillMaxWidth().height(220.dp)
                              )
                              LazyColumn(
                                  state = list, modifier = Modifier.weight(1f),
                                  verticalArrangement = Arrangement.spacedBy(8.dp)
                              ) {
                                  items(msgs.size) { i ->
                                      val m = msgs[i]
                                      val mine = m.first == "user"
                                      Box(
                                          Modifier.fillMaxWidth(),
                                          contentAlignment = if (mine) Alignment.CenterEnd else Alignment.CenterStart
                                      ) {
                                          Text(
                                              m.second, color = Color.White,
                                              modifier = Modifier.widthIn(max = 300.dp)
                                                  .background(
                                                      if (mine) Color(0xFF2A2A2A) else Color(0xFF4A3A12),
                                                      RoundedCornerShape(14.dp)
                                                  ).padding(12.dp)
                                          )
                                      }
                                  }
                              }
                              if (busy) Text("... düşünüyor", color = Color.Gray, modifier = Modifier.padding(4.dp))
                              Row(
                                  horizontalArrangement = Arrangement.spacedBy(6.dp),
                                  modifier = Modifier.padding(vertical = 6.dp)
                              ) {
                                  OutlinedButton(onClick = {
                                      val line = persona.lines.random()
                                      msgs.add("assistant" to line)
                                      scope.launch { say(line, pitch, rate) }
                                  }) { Text("Racon") }
                                  OutlinedButton(onClick = { stopSpeaking() }) { Text("Sus") }
                              }
                              LabeledSlider("Ses kalınlığı (telefon sesi)", pitch, 0.3f..1.2f) { pitch = it }
                              LabeledSlider("Konuşma hızı (telefon sesi)", rate, 0.5f..1.3f) { rate = it }
                              Row(
                                  verticalAlignment = Alignment.CenterVertically,
                                  horizontalArrangement = Arrangement.spacedBy(6.dp)
                              ) {
                                  OutlinedTextField(
                                      value = input, onValueChange = { input = it },
                                      modifier = Modifier.weight(1f),
                                      placeholder = { Text("Söyle evlat...") }
                                  )
                                  Button(onClick = {
                                      val i = Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH)
                                          .putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM)
                                          .putExtra(RecognizerIntent.EXTRA_LANGUAGE, "tr-TR")
                                      try { mic.launch(i) } catch (e: Exception) { }
                                  }) { Text("🎤") }
                                  Button(onClick = { send(input) }) { Text("➤") }
                              }
                          }
                      } else {
                          Column(
                              Modifier.fillMaxSize().statusBarsPadding().navigationBarsPadding()
                                  .verticalScroll(rememberScrollState()).padding(12.dp)
                          ) {
                              Row(Modifier.fillMaxWidth(), verticalAlignment = Alignment.CenterVertically) {
                                  Text(
                                      "Ayarlar", color = Color(0xFFC9A24B),
                                      style = MaterialTheme.typography.headlineSmall,
                                      modifier = Modifier.weight(1f)
                                  )
                                  OutlinedButton(onClick = { testing = false; screen = "main" }) { Text("Kapat") }
                              }

                              Spacer(Modifier.height(10.dp))
                              Text("Konuşan resim", color = Color.White, style = MaterialTheme.typography.titleMedium)
                              TalkingAvatar(
                                  avatar, smooth, mouthY, mouthX, mouthW, jaw,
                                  Modifier.fillMaxWidth().height(260.dp)
                              )
                              Row(horizontalArrangement = Arrangement.spacedBy(6.dp)) {
                                  Button(onClick = { pick.launch("image/*") }) { Text("Resim seç") }
                                  OutlinedButton(onClick = { testing = !testing }) {
                                      Text(if (testing) "Testi durdur" else "Ağız testi")
                                  }
                              }
                              LabeledSlider("Ağız çizgisi (yukarı-aşağı): dudakların arasına getir", mouthY, 0.05f..0.95f) {
                                  mouthY = it; prefs.mouthY = it
                              }
                              LabeledSlider("Ağız konumu (sol-sağ)", mouthX, 0.1f..0.9f) { mouthX = it; prefs.mouthX = it }
                              LabeledSlider("Ağız genişliği", mouthW, 0.05f..0.6f) { mouthW = it; prefs.mouthW = it }
                              LabeledSlider("Ağız açıklığı", jaw, 0.01f..0.15f) { jaw = it; prefs.jaw = it }

                              Spacer(Modifier.height(16.dp))
                              Text("Groq API anahtarı", color = Color.White, style = MaterialTheme.typography.titleMedium)
                              Text("Boş bırakırsan koddaki yerleşik anahtar kullanılır.", color = Color.Gray, style = MaterialTheme.typography.labelSmall)
                              OutlinedTextField(
                                  value = gk, onValueChange = { gk = it; prefs.groqKey = it },
                                  modifier = Modifier.fillMaxWidth(), singleLine = true,
                                  visualTransformation = PasswordVisualTransformation(),
                                  placeholder = { Text("gsk_...") }
                              )

                              Spacer(Modifier.height(16.dp))
                              Text("ElevenLabs sesi", color = Color.White, style = MaterialTheme.typography.titleMedium)
                              Row(verticalAlignment = Alignment.CenterVertically) {
                                  Text("ElevenLabs kullan", color = Color.White, modifier = Modifier.weight(1f))
                                  Switch(checked = useEl, onCheckedChange = { useEl = it; prefs.useEl = it })
                              }
                              OutlinedTextField(
                                  value = ek, onValueChange = { ek = it; prefs.elKey = it },
                                  modifier = Modifier.fillMaxWidth(), singleLine = true,
                                  visualTransformation = PasswordVisualTransformation(),
                                  placeholder = { Text("ElevenLabs API anahtarı") }
                              )
                              OutlinedTextField(
                                  value = ev, onValueChange = { ev = it; prefs.elVoice = it },
                                  modifier = Modifier.fillMaxWidth(), singleLine = true,
                                  placeholder = { Text("Voice ID") }
                              )
                              OutlinedButton(onClick = {
                                  scope.launch { say("Ben Polat Alemdar. Dinliyorum evlat.", pitch, rate) }
                              }) { Text("Sesi dene") }

                              Spacer(Modifier.height(16.dp))
                              Text("Telefonun Türkçe sesleri", color = Color.White, style = MaterialTheme.typography.titleMedium)
                              Text(
                                  "Android ses cinsiyetini bildirmiyor; hepsini deneyip kalın erkek sesini seç.",
                                  color = Color.Gray, style = MaterialTheme.typography.labelSmall
                              )
                              if (voices.isEmpty()) Text("Türkçe ses bulunamadı.", color = Color.Gray)
                              voices.forEach { v ->
                                  Row(verticalAlignment = Alignment.CenterVertically, modifier = Modifier.padding(vertical = 2.dp)) {
                                      Text(
                                          (if (v == chosen) "✓ " else "") + v, color = Color.White,
                                          modifier = Modifier.weight(1f)
                                      )
                                      OutlinedButton(onClick = {
                                          chosen = v
                                          prefs.voiceName = v
                                          applyVoice(v)
                                          speakSystem("Ben Polat Alemdar. Dinliyorum evlat.", pitch, rate)
                                      }) { Text("Dene") }
                                  }
                              }

                              Spacer(Modifier.height(16.dp))
                              Text("Bilgi notları (bölüm özetleri)", color = Color.White, style = MaterialTheme.typography.titleMedium)
                              Text(
                                  "Bölüm, olay, karakter özetlerini yapıştır; konular boş satırla ayrılsın. " +
                                      "Sorduğun şeyle en çok örtüşen 2 not Polat'a verilir.",
                                  color = Color.Gray, style = MaterialTheme.typography.labelSmall
                              )
                              OutlinedTextField(
                                  value = lore, onValueChange = { lore = it; prefs.lore = it },
                                  modifier = Modifier.fillMaxWidth().heightIn(min = 200.dp)
                              )
                              Spacer(Modifier.height(24.dp))
                          }
                      }
                  }
              }
          }
          EOF

      - name: APK derle
        working-directory: polat
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: PolatAI-apk
          path: polat/app/build/outputs/apk/debug/app-debug.apk
