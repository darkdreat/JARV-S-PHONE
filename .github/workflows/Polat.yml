name: Polat AI APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Proje dosyalarini olustur
        run: |
          mkdir -p polat/app/src/main/java/com/polat/ai polat/app/src/main/res/values

          cat > polat/settings.gradle.kts <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "PolatAI"
          include(":app")
          EOF

          cat > polat/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF

          cat > polat/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3g
          android.useAndroidX=true
          kotlin.code.style=official
          EOF

          cat > polat/app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.polat.ai"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.polat.ai"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
              buildFeatures { compose = true }
              composeOptions { kotlinCompilerExtensionVersion = "1.5.14" }
          }
          dependencies {
              implementation(platform("androidx.compose:compose-bom:2024.06.00"))
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.foundation:foundation")
              implementation("androidx.activity:activity-compose:1.9.0")
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1")
          }
          EOF

          cat > polat/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <queries>
                  <intent><action android:name="android.intent.action.TTS_SERVICE" /></intent>
                  <intent><action android:name="android.speech.action.RECOGNIZE_SPEECH" /></intent>
              </queries>
              <application
                  android:label="Polat AI"
                  android:theme="@style/Theme.PolatAI">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > polat/app/src/main/res/values/themes.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.PolatAI" parent="android:Theme.Material.NoActionBar">
                  <item name="android:windowBackground">#0B0B0B</item>
                  <item name="android:statusBarColor">#0B0B0B</item>
                  <item name="android:navigationBarColor">#0B0B0B</item>
              </style>
          </resources>
          EOF

          cat > polat/app/src/main/java/com/polat/ai/Vault.kt <<'EOF'
          package com.polat.ai

          import android.util.Base64
          import java.security.MessageDigest

          // API anahtari APK icinde duz metin olarak durmaz; calisirken cozulur.
          object Vault {
              private val parts = listOf(
                  "uaYB8Nux406HEJQqifSg76SCs/bROxOE",
                  "jO8eIEUch69NW9keaY70Z4Eko2rzrpOGnfyeK2fG8ak="
              )

              fun key(): String {
                  val raw = Base64.decode(parts.joinToString(""), Base64.DEFAULT)
                  val salt = listOf("polat", "ai", "salt", "v1").joinToString("-")
                  val k = MessageDigest.getInstance("SHA-256").digest(salt.toByteArray())
                  val out = ByteArray(raw.size) { i ->
                      (raw[i].toInt() xor k[i % 32].toInt() xor ((i * 7) and 255)).toByte()
                  }
                  return String(out)
              }
          }
          EOF

