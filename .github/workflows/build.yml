name: Build JARVIS APK

# Tek dosya: Repoya sadece bu dosyayi .github/workflows/build.yml olarak koy.
# Actions sekmesinden "Run workflow" de, bitince Artifacts'tan APK'yi indir.

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Proje dosyalarini olustur
        run: |
          set -e
          mkdir -p jarvis && cd jarvis
          mkdir -p "app"
          cat > "app/build.gradle.kts" <<'JARVIS_EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
          }

          android {
              namespace = "com.jarvis.offline"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.jarvis.offline"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 2
                  versionName = "2.0"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
              buildFeatures { compose = true }
          }

          dependencies {
              val composeBom = platform("androidx.compose:compose-bom:2024.10.01")
              implementation(composeBom)
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.foundation:foundation")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-extended")
              implementation("androidx.activity:activity-compose:1.9.3")
              implementation("androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7")
              implementation("androidx.lifecycle:lifecycle-runtime-compose:2.8.7")
              implementation("io.coil-kt:coil-compose:2.7.0")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0")
          }
          JARVIS_EOF
          mkdir -p "app/src/main"
          cat > "app/src/main/AndroidManifest.xml" <<'JARVIS_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.READ_CONTACTS" />
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
              <uses-permission android:name="android.permission.SET_ALARM" />
              <uses-permission android:name="android.permission.WRITE_SETTINGS" />

              <queries>
                  <intent><action android:name="android.intent.action.MAIN" /><category android:name="android.intent.category.LAUNCHER" /></intent>
                  <intent><action android:name="android.speech.RecognitionService" /></intent>
                  <intent><action android:name="android.intent.action.TTS_SERVICE" /></intent>
              </queries>

              <application
                  android:allowBackup="false"
                  android:label="@string/app_name"
                  android:theme="@style/Theme.Jarvis">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          JARVIS_EOF
          mkdir -p "app/src/main/java/com/jarvis/offline"
          cat > "app/src/main/java/com/jarvis/offline/GroqClient.kt" <<'JARVIS_EOF'
          package com.jarvis.offline

          import android.content.Context
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.withContext
          import org.json.JSONArray
          import org.json.JSONObject
          import java.net.HttpURLConnection
          import java.net.URL

          /**
           * Groq sohbet istemcisi. Token tüketimini düşük tutmak için:
           *  - kısa sistem mesajı, en fazla [MAX_TOKENS] cevap tokenı
           *  - sadece son [HISTORY] mesaj gönderilir
           * API anahtarı koda gömülmez; uygulamada girilir ve telefonda saklanır.
           */
          class GroqClient(context: Context) {

              private val prefs = context.getSharedPreferences("jarvis", Context.MODE_PRIVATE)

              var apiKey: String
                  get() = prefs.getString("groq_key", "") ?: ""
                  set(v) = prefs.edit().putString("groq_key", v.trim()).apply()

              var model: String
                  get() = prefs.getString("groq_model", DEFAULT_MODEL) ?: DEFAULT_MODEL
                  set(v) = prefs.edit().putString("groq_model", v.trim().ifBlank { DEFAULT_MODEL }).apply()

              val hasKey: Boolean get() = apiKey.isNotBlank()

              private val history = ArrayList<Pair<String, String>>() // (role, content)

              suspend fun ask(prompt: String): String = withContext(Dispatchers.IO) {
                  if (!hasKey) return@withContext "Önce Groq API anahtarını girmelisiniz efendim."

                  history += "user" to prompt
                  while (history.size > HISTORY) history.removeAt(0)

                  val messages = JSONArray().put(
                      JSONObject().put("role", "system").put("content", SYSTEM_PROMPT)
                  )
                  history.forEach { (r, c) -> messages.put(JSONObject().put("role", r).put("content", c)) }

                  val body = JSONObject()
                      .put("model", model)
                      .put("messages", messages)
                      .put("max_tokens", MAX_TOKENS)
                      .put("temperature", 0.7)

                  val conn = (URL("https://api.groq.com/openai/v1/chat/completions").openConnection() as HttpURLConnection)
                  try {
                      conn.requestMethod = "POST"
                      conn.connectTimeout = 15000
                      conn.readTimeout = 30000
                      conn.doOutput = true
                      conn.setRequestProperty("Content-Type", "application/json")
                      conn.setRequestProperty("Authorization", "Bearer $apiKey")
                      conn.outputStream.use { it.write(body.toString().toByteArray()) }

                      val code = conn.responseCode
                      if (code !in 200..299) {
                          history.removeAt(history.lastIndex)
                          return@withContext when (code) {
                              401 -> "API anahtarı geçersiz görünüyor efendim."
                              429 -> "Groq kullanım limiti doldu, biraz bekleyelim."
                              else -> "Groq hatası ($code)."
                          }
                      }
                      val text = conn.inputStream.bufferedReader().use { it.readText() }
                      val answer = JSONObject(text)
                          .getJSONArray("choices").getJSONObject(0)
                          .getJSONObject("message").getString("content").trim()
                      history += "assistant" to answer
                      answer
                  } catch (e: java.io.IOException) {
                      history.removeAt(history.lastIndex)
                      "İnternete ulaşamıyorum efendim."
                  } finally {
                      conn.disconnect()
                  }
              }

              fun reset() = history.clear()

              companion object {
                  const val DEFAULT_MODEL = "llama-3.1-8b-instant"
                  const val MAX_TOKENS = 150
                  const val HISTORY = 6
                  const val SYSTEM_PROMPT =
                      "Sen JARVIS'sin, kullanıcının sesli asistanısın. Her zaman Türkçe, kısa ve net cevap ver " +
                          "(en fazla 2-3 cümle). Nazik ve hafif esprili ol, kullanıcıya 'efendim' diye hitap et."
              }
          }
          JARVIS_EOF
          mkdir -p "app/src/main/java/com/jarvis/offline"
          cat > "app/src/main/java/com/jarvis/offline/JarvisOrb.kt" <<'JARVIS_EOF'
          package com.jarvis.offline

          import androidx.compose.foundation.Canvas
          import androidx.compose.foundation.layout.aspectRatio
          import androidx.compose.foundation.layout.fillMaxWidth
          import androidx.compose.runtime.Composable
          import androidx.compose.runtime.LaunchedEffect
          import androidx.compose.runtime.getValue
          import androidx.compose.runtime.mutableFloatStateOf
          import androidx.compose.runtime.remember
          import androidx.compose.runtime.rememberUpdatedState
          import androidx.compose.runtime.setValue
          import androidx.compose.runtime.withFrameNanos
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.geometry.Offset
          import androidx.compose.ui.graphics.Brush
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.graphics.drawscope.Stroke
          import kotlin.math.PI
          import kotlin.math.cos
          import kotlin.math.sin
          import kotlin.math.sqrt
          import kotlin.random.Random

          enum class JState { IDLE, LISTENING, THINKING, SPEAKING }

          private val Cyan = Color(0xFF00E5FF)
          private val Ice = Color(0xFFBDF7FF)

          private class Orb(
              val angle: Float, val radius: Float, val size: Float,
              val sp1: Float, val sp2: Float, val ph1: Float, val ph2: Float, val alpha: Float
          )

          /**
           * İnce bir halka ve içinde yüzen küçük mavi toplar.
           * Boştayken toplar havada süzülür; dinlerken/konuşurken (ses seviyesine göre) canlanır,
           * düşünürken halkanın içinde döner.
           */
          @Composable
          fun JarvisOrb(state: JState, level: Float, modifier: Modifier = Modifier) {
              val orbs = remember {
                  val rnd = Random(7)
                  List(46) {
                      Orb(
                          angle = rnd.nextFloat() * 2f * PI.toFloat(),
                          radius = 0.12f + 0.74f * sqrt(rnd.nextFloat()),
                          size = 0.010f + 0.018f * rnd.nextFloat(),
                          sp1 = 0.25f + rnd.nextFloat() * 0.6f,
                          sp2 = 0.25f + rnd.nextFloat() * 0.6f,
                          ph1 = rnd.nextFloat() * 6.28f,
                          ph2 = rnd.nextFloat() * 6.28f,
                          alpha = 0.55f + 0.45f * rnd.nextFloat()
                      )
                  }
              }

              val stateNow by rememberUpdatedState(state)
              val levelNow by rememberUpdatedState(level)
              var time by remember { mutableFloatStateOf(0f) }
              var energy by remember { mutableFloatStateOf(0f) }   // 0..1 canlılık
              var swirl by remember { mutableFloatStateOf(0f) }    // 0..1 dönme

              LaunchedEffect(Unit) {
                  var last = 0L
                  while (true) {
                      withFrameNanos { now ->
                          val dt = if (last == 0L) 0.016f else ((now - last) / 1e9f).coerceAtMost(0.05f)
                          last = now
                          time += dt

                          // Konuşurken gerçek ses seviyesi yok; doğal görünen yapay bir "ses" üret
                          val speakingWave = 0.55f + 0.30f * sin(time * 7.3f) * sin(time * 2.9f) + 0.1f * sin(time * 13f)
                          val targetEnergy = when (stateNow) {
                              JState.IDLE -> 0f
                              JState.LISTENING -> maxOf(0.25f, levelNow)
                              JState.THINKING -> 0.3f
                              JState.SPEAKING -> speakingWave
                          }
                          energy += (targetEnergy - energy) * (dt * 6f).coerceAtMost(1f)
                          val targetSwirl = if (stateNow == JState.THINKING) 1f else 0f
                          swirl += (targetSwirl - swirl) * (dt * 3f).coerceAtMost(1f)
                      }
                  }
              }

              Canvas(modifier.fillMaxWidth().aspectRatio(1f)) {
                  val c = center
                  val ringR = size.minDimension / 2f * 0.94f

                  // Halkanın dışındaki yumuşak parıltı (enerjiyle nefes alır)
                  drawCircle(
                      Brush.radialGradient(
                          listOf(Color.Transparent, Cyan.copy(alpha = 0.10f + 0.20f * energy), Color.Transparent),
                          center = c, radius = ringR * 1.12f
                      ),
                      radius = ringR * 1.12f
                  )
                  // İnce halka
                  drawCircle(Cyan.copy(alpha = 0.55f + 0.35f * energy), ringR, c, style = Stroke(width = ringR * 0.012f))

                  val swirlAngle = time * 0.9f * swirl
                  orbs.forEach { o ->
                      val amp = ringR * (0.035f + 0.075f * energy)
                      val breathe = 1f + 0.14f * energy * sin(time * 5f + o.ph1)
                      val r = (o.radius * ringR * breathe).coerceAtMost(ringR * 0.92f)
                      val a = o.angle + swirlAngle * (0.5f + o.radius)
                      val x = c.x + cos(a) * r + sin(time * o.sp1 + o.ph1) * amp
                      val y = c.y + sin(a) * r + cos(time * o.sp2 + o.ph2) * amp
                      val s = ringR * o.size * (1f + 0.7f * energy)
                      val p = Offset(x, y)

                      drawCircle(Cyan.copy(alpha = 0.18f * o.alpha + 0.12f * energy), s * 3f, p)   // hale
                      drawCircle(Cyan.copy(alpha = o.alpha), s * 1.3f, p)
                      drawCircle(Ice.copy(alpha = o.alpha), s * 0.55f, p)                          // parlak merkez
                  }
              }
          }
          JARVIS_EOF
          mkdir -p "app/src/main/java/com/jarvis/offline"
          cat > "app/src/main/java/com/jarvis/offline/JarvisViewModel.kt" <<'JARVIS_EOF'
          package com.jarvis.offline

          import android.app.Application
          import android.net.Uri
          import androidx.compose.runtime.getValue
          import androidx.compose.runtime.mutableFloatStateOf
          import androidx.compose.runtime.mutableStateListOf
          import androidx.compose.runtime.mutableStateOf
          import androidx.compose.runtime.setValue
          import androidx.lifecycle.AndroidViewModel
          import androidx.lifecycle.viewModelScope
          import kotlinx.coroutines.launch

          data class Msg(val fromUser: Boolean, val text: String)

          class JarvisViewModel(app: Application) : AndroidViewModel(app) {

              val messages = mutableStateListOf<Msg>()
              var jState by mutableStateOf(JState.IDLE)
              var level by mutableFloatStateOf(0f)
              var status by mutableStateOf("")
              var hasKey by mutableStateOf(false)
              var pickedImage by mutableStateOf<Uri?>(null)

              private val prefs = app.getSharedPreferences("jarvis", android.content.Context.MODE_PRIVATE)
              var doubleVolumeEnabled by mutableStateOf(prefs.getBoolean("double_volume_enabled", true))
                  private set

              private val groq = GroqClient(app)
              private val commands = PhoneCommands(app)
              private val voice = VoiceIO(
                  context = app,
                  onLevel = { level = it },
                  onHeard = { submit(it) },
                  onListenEnd = { if (jState == JState.LISTENING) jState = JState.IDLE },
                  onSpeakStart = { jState = JState.SPEAKING },
                  onSpeakEnd = { jState = JState.IDLE; level = 0f },
                  onError = { status = it },
              )

              init { refreshKeyState() }

              val apiKey: String get() = groq.apiKey
              val model: String get() = groq.model

              fun saveSettings(key: String, model: String) {
                  groq.apiKey = key
                  groq.model = model
                  refreshKeyState()
              }

              private fun refreshKeyState() {
                  hasKey = groq.hasKey
                  status = if (hasKey) "Hazır. Halkaya dokunup konuşun." else "Groq API anahtarı girin (Ayarlar düğmesi)."
              }

              fun setDoubleVolumeEnabled(enabled: Boolean) {
                  doubleVolumeEnabled = enabled
                  prefs.edit().putBoolean("double_volume_enabled", enabled).apply()
              }

              fun startListeningFromShortcut() {
                  if (jState == JState.LISTENING) {
                      voice.stopListening()
                      jState = JState.IDLE
                      status = "Dinleme durduruldu."
                  } else {
                      jState = JState.LISTENING
                      status = "Ses kısma kısayoluyla dinleniyor..."
                      voice.listen()
                  }
              }

              fun toggleListen() {
                  when (jState) {
                      JState.LISTENING -> { voice.stopListening(); jState = JState.IDLE }
                      JState.THINKING -> {}
                      else -> { jState = JState.LISTENING; voice.listen() }
                  }
              }

              fun submit(text: String) {
                  if (text.isBlank()) return
                  messages += Msg(true, text)

                  // 1) Telefon komutu mu? Yerel çalışır, Groq'a token harcanmaz.
                  val local = try { commands.handle(text) } catch (e: Exception) { "Komut çalışmadı: ${e.message}" }
                  if (local != null) { say(local); return }

                  // 2) Değilse Groq'a sor
                  if (!hasKey) { say("Önce Groq API anahtarını girmelisiniz efendim."); return }
                  viewModelScope.launch {
                      jState = JState.THINKING
                      val answer = try {
                          groq.ask(text)
                      } catch (e: Throwable) {
                          "Bir hata oluştu: ${e.message}"
                      }
                      say(answer.ifBlank { "Anlayamadım efendim." })
                  }
              }

              private fun say(text: String) {
                  messages += Msg(false, text)
                  voice.speak(text)
                  if (jState == JState.THINKING) jState = JState.IDLE
              }

              fun clearChat() { messages.clear(); groq.reset() }

              override fun onCleared() { voice.destroy() }
          }
          JARVIS_EOF
          mkdir -p "app/src/main/java/com/jarvis/offline"
          cat > "app/src/main/java/com/jarvis/offline/MainActivity.kt" <<'JARVIS_EOF'
          package com.jarvis.offline

          import android.Manifest
          import android.content.Context
          import android.media.AudioManager
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.view.KeyEvent
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.rememberLauncherForActivityResult
          import androidx.activity.compose.setContent
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.activity.viewModels
          import androidx.compose.animation.AnimatedVisibility
          import androidx.compose.animation.animateContentSize
          import androidx.compose.animation.core.FastOutSlowInEasing
          import androidx.compose.animation.core.RepeatMode
          import androidx.compose.animation.core.animateFloat
          import androidx.compose.animation.core.infiniteRepeatable
          import androidx.compose.animation.core.rememberInfiniteTransition
          import androidx.compose.animation.core.tween
          import androidx.compose.foundation.BorderStroke
          import androidx.compose.foundation.Image
          import androidx.compose.foundation.background
          import androidx.compose.foundation.border
          import androidx.compose.foundation.clickable
          import androidx.compose.foundation.interaction.MutableInteractionSource
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.LazyColumn
          import androidx.compose.foundation.lazy.items
          import androidx.compose.foundation.lazy.rememberLazyListState
          import androidx.compose.foundation.shape.CircleShape
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.material.icons.Icons
          import androidx.compose.material.icons.filled.DeleteSweep
          import androidx.compose.material.icons.filled.Image
          import androidx.compose.material.icons.filled.Settings
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.draw.alpha
          import androidx.compose.ui.draw.clip
          import androidx.compose.ui.draw.scale
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.layout.ContentScale
          import androidx.compose.ui.platform.LocalContext
          import androidx.compose.ui.res.painterResource
          import androidx.compose.ui.text.input.PasswordVisualTransformation
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import coil.compose.AsyncImage

          private val Cyan = Color(0xFF55E8FF)
          private val Panel = Color(0xD9081B27)
          private val Muted = Color(0xFF8BB8C4)

          class MainActivity : ComponentActivity() {
              private val vm: JarvisViewModel by viewModels()
              private val keyHandler = Handler(Looper.getMainLooper())
              private var firstVolumePress = 0L
              private var pendingVolumeAction: Runnable? = null

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContent { JarvisScreen(vm) }
              }

              // Android, uygulama ön plandayken fiziksel ses tuşu olaylarını uygulamaya iletir.
              // İki hızlı ses kısma basışı dinleme oturumunu açar/kapatır.
              override fun dispatchKeyEvent(event: KeyEvent): Boolean {
                  if (event.keyCode != KeyEvent.KEYCODE_VOLUME_DOWN || event.action != KeyEvent.ACTION_DOWN ||
                      event.repeatCount > 0 || !vm.doubleVolumeEnabled
                  ) return super.dispatchKeyEvent(event)

                  val now = android.os.SystemClock.elapsedRealtime()
                  if (firstVolumePress != 0L && now - firstVolumePress <= 450L) {
                      pendingVolumeAction?.let { keyHandler.removeCallbacks(it) }
                      pendingVolumeAction = null
                      firstVolumePress = 0L
                      vm.startListeningFromShortcut()
                      return true
                  }

                  firstVolumePress = now
                  val action = Runnable {
                      firstVolumePress = 0L
                      val audio = getSystemService(Context.AUDIO_SERVICE) as AudioManager
                      audio.adjustStreamVolume(AudioManager.STREAM_MUSIC, AudioManager.ADJUST_LOWER, 0)
                      pendingVolumeAction = null
                  }
                  pendingVolumeAction = action
                  keyHandler.postDelayed(action, 470L)
                  return true
              }

              override fun onDestroy() {
                  pendingVolumeAction?.let { keyHandler.removeCallbacks(it) }
                  super.onDestroy()
              }
          }

          @Composable
          fun JarvisScreen(vm: JarvisViewModel) {
              var input by remember { mutableStateOf("") }
              var showSettings by remember { mutableStateOf(false) }
              val listState = rememberLazyListState()
              val context = LocalContext.current
              val pulse = rememberInfiniteTransition(label = "headerPulse")
              val headerAlpha by pulse.animateFloat(
                  initialValue = 0.72f, targetValue = 1f,
                  animationSpec = infiniteRepeatable(tween(1700, easing = FastOutSlowInEasing), RepeatMode.Reverse),
                  label = "headerAlpha"
              )

              val perms = rememberLauncherForActivityResult(ActivityResultContracts.RequestMultiplePermissions()) {}
              val imagePicker = rememberLauncherForActivityResult(ActivityResultContracts.GetContent()) { uri ->
                  vm.pickedImage = uri
              }

              LaunchedEffect(Unit) {
                  perms.launch(arrayOf(Manifest.permission.RECORD_AUDIO, Manifest.permission.READ_CONTACTS))
              }
              LaunchedEffect(vm.messages.size) {
                  if (vm.messages.isNotEmpty()) listState.animateScrollToItem(vm.messages.lastIndex)
              }

              Box(Modifier.fillMaxSize().background(Color(0xFF030A12))) {
                  Image(
                      painter = painterResource(R.drawable.jarvis_background),
                      contentDescription = "JARVIS arka plan görseli",
                      contentScale = ContentScale.Crop,
                      modifier = Modifier.fillMaxSize().alpha(0.48f)
                  )
                  Box(Modifier.fillMaxSize().background(Color(0xA8030A12)))
                  Column(
                      Modifier.fillMaxSize().padding(horizontal = 16.dp, vertical = 10.dp),
                      horizontalAlignment = Alignment.CenterHorizontally
                  ) {
                      Row(
                          Modifier.fillMaxWidth().padding(bottom = 3.dp),
                          verticalAlignment = Alignment.CenterVertically,
                          horizontalArrangement = Arrangement.SpaceBetween
                      ) {
                          Column {
                              Text("J.A.R.V.I.S", color = Cyan.copy(alpha = headerAlpha), fontSize = 23.sp, letterSpacing = 5.sp)
                              Text("PERSONAL AI SYSTEM", color = Muted, fontSize = 9.sp, letterSpacing = 2.sp)
                          }
                          IconButton(
                              onClick = { showSettings = true },
                              modifier = Modifier.size(44.dp).clip(CircleShape)
                                  .background(Panel).border(1.dp, Cyan.copy(alpha = .55f), CircleShape)
                          ) {
                              Icon(Icons.Filled.Settings, contentDescription = "Ayarlar", tint = Cyan)
                          }
                      }

                      Box(
                          Modifier.fillMaxWidth(0.68f).padding(vertical = 5.dp)
                              .clickable(interactionSource = remember { MutableInteractionSource() }, indication = null) {
                                  vm.toggleListen()
                              }
                      ) { JarvisOrb(vm.jState, vm.level) }

                      AnimatedVisibility(visible = true) {
                          Text(
                              vm.status.ifBlank { "Hazır. Dinlemek için merkeze dokunun." },
                              color = if (vm.jState == JState.LISTENING) Color(0xFF7CFFCE) else Cyan.copy(alpha = .8f),
                              fontSize = 11.sp,
                              modifier = Modifier.padding(bottom = 4.dp)
                          )
                      }

                      AnimatedVisibility(visible = vm.pickedImage != null) {
                          vm.pickedImage?.let { uri ->
                              AsyncImage(
                                  model = uri, contentDescription = "Seçilen görsel", contentScale = ContentScale.Crop,
                                  modifier = Modifier.padding(top = 5.dp).fillMaxWidth().height(82.dp)
                                      .clip(RoundedCornerShape(12.dp)).border(1.dp, Cyan.copy(alpha = .7f), RoundedCornerShape(12.dp))
                              )
                          }
                      }

                      LazyColumn(
                          state = listState,
                          modifier = Modifier.weight(1f).fillMaxWidth().padding(top = 7.dp)
                              .clip(RoundedCornerShape(18.dp)).background(Color(0x44081722)).padding(8.dp),
                          verticalArrangement = Arrangement.spacedBy(7.dp)
                      ) {
