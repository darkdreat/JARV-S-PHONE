              }
              ctx.getSharedPreferences(PREF, 0).edit().putString("scheduled", a.toString()).apply()
          }

          private fun alarmPending(ctx: Context, id: Int): PendingIntent =
              PendingIntent.getBroadcast(
                  ctx,
                  id,
                  Intent(ctx, AlarmReceiver::class.java).putExtra("id", id),
                  PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
              )

          fun scheduleAlarm(ctx: Context, s: Scheduled) {
              val am = ctx.getSystemService(Context.ALARM_SERVICE) as AlarmManager
              val pi = alarmPending(ctx, s.id)
              try {
                  am.setExactAndAllowWhileIdle(AlarmManager.RTC_WAKEUP, s.at, pi)
              } catch (_: SecurityException) {
                  am.setAndAllowWhileIdle(AlarmManager.RTC_WAKEUP, s.at, pi)
              }
          }

          fun cancelScheduled(ctx: Context, id: Int) {
              try {
                  val am = ctx.getSystemService(Context.ALARM_SERVICE) as AlarmManager
                  am.cancel(alarmPending(ctx, id))
              } catch (_: Exception) {
              }
          }

          fun waNumber(s: String): String {
              val d = s.filter { it.isDigit() }
              return when {
                  d.startsWith("00") -> d.drop(2)
                  d.startsWith("90") && d.length == 12 -> d
                  d.startsWith("0") && d.length == 11 -> "90" + d.drop(1)
                  d.length == 10 -> "90" + d
                  else -> d
              }
          }

          fun waIntent(ctx: Context, number: String, text: String): Intent {
              val uri = Uri.parse(
                  "https://api.whatsapp.com/send?phone=" + waNumber(number) + "&text=" + Uri.encode(text)
              )
              val i = Intent(Intent.ACTION_VIEW, uri).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
              val pm = ctx.packageManager
              if (pm.getLaunchIntentForPackage("com.whatsapp") != null) {
                  i.setPackage("com.whatsapp")
              } else if (pm.getLaunchIntentForPackage("com.whatsapp.w4b") != null) {
                  i.setPackage("com.whatsapp.w4b")
              }
              return i
          }

          fun sendNow(ctx: Context, number: String, text: String): Boolean {
              SendState.until = SystemClock.elapsedRealtime() + 120_000L
              return try {
                  ctx.startActivity(waIntent(ctx, number, text))
                  true
              } catch (_: Exception) {
                  SendState.until = 0L
                  false
              }
          }

          fun a11yEnabled(ctx: Context): Boolean {
              val s = Settings.Secure.getString(
                  ctx.contentResolver,
                  Settings.Secure.ENABLED_ACCESSIBILITY_SERVICES
              ) ?: return false
              return s.contains(ctx.packageName + "/")
          }

          fun fmtClock(h: Int, m: Int): String = String.format(TR, "%02d:%02d", h, m)

          fun fmtWhen(at: Long): String {
              val now = Calendar.getInstance()
              val t = Calendar.getInstance().apply { timeInMillis = at }
              val day = when {
                  now.get(Calendar.YEAR) == t.get(Calendar.YEAR) &&
                      now.get(Calendar.DAY_OF_YEAR) == t.get(Calendar.DAY_OF_YEAR) -> "bugün"
                  now.get(Calendar.YEAR) == t.get(Calendar.YEAR) &&
                      now.get(Calendar.DAY_OF_YEAR) + 1 == t.get(Calendar.DAY_OF_YEAR) -> "yarın"
                  else -> SimpleDateFormat("d MMMM", TR).format(Date(at))
              }
              return day + " " + SimpleDateFormat("HH:mm", TR).format(Date(at))
          }

          object Actions {

              private val NUM = mapOf(
                  "sifir" to 0, "bir" to 1, "iki" to 2, "uc" to 3, "dort" to 4, "bes" to 5,
                  "alti" to 6, "yedi" to 7, "sekiz" to 8, "dokuz" to 9, "on" to 10,
                  "yirmi" to 20, "otuz" to 30, "kirk" to 40, "elli" to 50, "altmis" to 60
              )

              private val SUFFIX = setOf("e", "a", "ye", "ya", "ne", "na", "den", "dan")

              private val WAKE_RAW =
                  Regex("(?i)^\\s*(hey|hay|ey)?\\s*(jarvis|carvis|harvis|cervis|javis|jar vis)[,.!]*\\s*")

              private val TIME_RAW = listOf(
                  Regex("(?i)\\b\\d{1,3}\\s*(saat|dakika|dk)\\s+sonra\\b"),
                  Regex("(?i)\\b\\d{1,2}\\s*[:.]\\s*\\d{2}(\\s*['’]?\\s*(da|de|ta|te|dan|den)\\b)?"),
                  Regex("(?i)\\bsaat\\s+\\d{1,2}(\\s*['’]?\\s*(da|de|ta|te)\\b)?"),
                  Regex("(?i)\\b\\d{1,2}\\s*['’]?\\s*(da|de|ta|te)\\b"),
                  Regex("(?i)\\b(bu\\s+)?(yarın|yarin|akşam|aksam|sabah|öğleden sonra|ogleden sonra|gece)\\s+(?=\\d)"),
                  Regex("(?i)\\b(yarın|yarin)\\b")
              )

              suspend fun handle(ctx: Context, n: String, raw: String): String? =
                  optimizeCmd(ctx, n) ?: timer(ctx, n) ?: alarm(ctx, n) ?: quick(ctx, n) ?: whatsapp(ctx, n, raw)

              // ---------- sayılar ve saat ----------

              private fun digits(n: String): String {
                  val out = ArrayList<String>()
                  var acc = -1
                  for (t in n.split(" ")) {
                      val v = NUM[t]
                      if (v != null) {
                          acc = if (acc < 0) v else acc + v
                      } else {
                          if (acc >= 0) {
                              out.add(acc.toString())
                              acc = -1
                          }
                          out.add(t)
                      }
                  }
                  if (acc >= 0) out.add(acc.toString())
                  return out.joinToString(" ")
              }

              private fun parseClock(src: String): Pair<Int, Int>? {
                  val n = digits(src)
                  val a = Regex("\\b(\\d{1,2}) (\\d{2})\\b").find(n)
                  var h: Int
                  val m: Int
                  if (a != null) {
                      h = a.groupValues[1].toInt()
                      m = a.groupValues[2].toInt()
                  } else {
                      val b = Regex("\\b(\\d{1,2})\\b( bucuk)?").find(n) ?: return null
                      h = b.groupValues[1].toInt()
                      m = if (b.groupValues[2].isNotEmpty()) 30 else 0
                  }
                  val pm = Regex("\\b(aksam|ogleden sonra)\\b").containsMatchIn(n)
                  if (pm && h in 1..11) {
                      h += 12
                  } else if (n.contains("gece") && h in 6..11) {
                      h += 12
                  }
                  if (h !in 0..23 || m !in 0..59) return null
                  return Pair(h, m)
              }

              private fun durationSec(n: String): Int {
                  var total = 0
                  Regex("\\b(\\d{1,3}) (saat|dakika|dk|saniye|sn)\\b").findAll(digits(n)).forEach {
                      val v = it.groupValues[1].toInt()
                      total += when (it.groupValues[2]) {
                          "saat" -> v * 3600
                          "dakika", "dk" -> v * 60
                          else -> v
                      }
                  }
                  return total
              }

              private fun spokenDuration(sec: Int): String {
                  val h = sec / 3600
                  val m = (sec % 3600) / 60
                  val s = sec % 60
                  val parts = ArrayList<String>()
                  if (h > 0) parts.add("$h saat")
                  if (m > 0) parts.add("$m dakika")
                  if (s > 0) parts.add("$s saniye")
                  return parts.joinToString(" ")
              }

              // ---------- zamanlayıcı ----------

              private fun timer(ctx: Context, n: String): String? {
                  val sec = durationSec(n)
                  val wants = n.contains("zamanlayici") || n.contains("sayac") || n.contains("geri sayim")
                  val relative = n.contains("sonra") && sec > 0 && !n.contains("yaz") &&
                      (n.contains("uyar") || n.contains("hatirlat") || n.contains("uyandir") || n.contains("alarm"))
                  if (!wants && !relative) return null
                  if (sec <= 0) return "Kaç dakikalık zamanlayıcı kurayım?"
                  return try {
                      val i = Intent(AlarmClock.ACTION_SET_TIMER)
                          .putExtra(AlarmClock.EXTRA_LENGTH, sec)
                          .putExtra(AlarmClock.EXTRA_MESSAGE, "Jarvis")
                          .putExtra(AlarmClock.EXTRA_SKIP_UI, true)
                          .addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                      ctx.startActivity(i)
                      spokenDuration(sec) + " için zamanlayıcı kuruldu."
                  } catch (_: Exception) {
                      "Zamanlayıcı kurulamadı. Saat uygulaması bulunamadı ya da izin verilmedi."
                  }
              }

              // ---------- alarm ----------

              fun setAlarm(ctx: Context, h: Int, m: Int, label: String, days: List<Int>?): Boolean {
                  return try {
                      val i = Intent(AlarmClock.ACTION_SET_ALARM)
                          .putExtra(AlarmClock.EXTRA_HOUR, h)
                          .putExtra(AlarmClock.EXTRA_MINUTES, m)
                          .putExtra(AlarmClock.EXTRA_MESSAGE, label)
                          .putExtra(AlarmClock.EXTRA_SKIP_UI, true)
                          .addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                      if (days != null) i.putIntegerArrayListExtra(AlarmClock.EXTRA_DAYS, ArrayList(days))
                      ctx.startActivity(i)
                      true
                  } catch (_: Exception) {
                      false
                  }
              }

              fun schoolAlarm(ctx: Context): String {
                  val p = ctx.getSharedPreferences(PREF, 0)
                  val st = p.getString("school", null)
                      ?: return "Okul saatini bilmiyorum. 'Okul saatim 9' de ya da Araçlar bölümünden ayarla."
                  val prep = p.getInt("prep", 90)
                  val mm = Regex("(\\d{1,2}):(\\d{2})").find(st) ?: return "Okul saati geçersiz."
                  val total = ((mm.groupValues[1].toInt() * 60 + mm.groupValues[2].toInt() - prep) % 1440 + 1440) % 1440
                  val h = total / 60
                  val m = total % 60
                  val days = listOf(
                      Calendar.MONDAY, Calendar.TUESDAY, Calendar.WEDNESDAY, Calendar.THURSDAY, Calendar.FRIDAY
                  )
                  return if (setAlarm(ctx, h, m, "Okul", days)) {
                      "Okul " + st + " de başlıyor. Hazırlanman için " + prep + " dakika pay bıraktım ve alarmı " +
                          fmtClock(h, m) + " olarak hafta içi her gün kurdum."
                  } else {
                      "Alarm kurulamadı. Saat uygulaması bulunamadı ya da izin verilmedi."
                  }
              }

              private fun alarm(ctx: Context, n: String): String? {
                  val saved = n.contains("okul saat")
                  val clock = parseClock(n)
                  if (saved && clock != null) {
                      ctx.getSharedPreferences(PREF, 0).edit()
                          .putString("school", fmtClock(clock.first, clock.second)).apply()
                      if (!n.contains("alarm")) {
                          return "Okul saatini " + fmtClock(clock.first, clock.second) + " olarak kaydettim."
                      }
                      return "Okul saatini " + fmtClock(clock.first, clock.second) + " olarak kaydettim. " + schoolAlarm(ctx)
                  }

                  if (!n.contains("alarm")) return null

                  if (n.contains("kapat") || n.contains("sil") || n.contains("iptal")) {
                      return try {
                          ctx.startActivity(Intent(AlarmClock.ACTION_SHOW_ALARMS).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK))
                          "Alarmları yönetebilmen için saat uygulamasını açıyorum."
                      } catch (_: Exception) {
                          "Saat uygulaması açılamadı."
                      }
                  }

                  if (n.contains("okul")) return schoolAlarm(ctx)

                  if (clock == null) return "Alarmı saat kaça kurayım?"

                  val days: List<Int>? = when {
                      n.contains("hafta ici") -> listOf(
                          Calendar.MONDAY, Calendar.TUESDAY, Calendar.WEDNESDAY, Calendar.THURSDAY, Calendar.FRIDAY
                      )
                      n.contains("her gun") -> listOf(1, 2, 3, 4, 5, 6, 7)
                      else -> null
                  }
                  return if (setAlarm(ctx, clock.first, clock.second, "Jarvis", days)) {
                      "Alarm " + fmtClock(clock.first, clock.second) + " için kuruldu."
                  } else {
                      "Alarm kurulamadı. Saat uygulaması bulunamadı ya da izin verilmedi."
                  }
              }

              // ---------- optimizasyon ----------

              private fun freeMb(am: ActivityManager): Int {
                  val mi = ActivityManager.MemoryInfo()
                  am.getMemoryInfo(mi)
                  return (mi.availMem / 1048576L).toInt()
              }

              suspend fun runOptimize(ctx: Context): String {
                  val am = ctx.getSystemService(Context.ACTIVITY_SERVICE) as ActivityManager
                  val before = freeMb(am)
                  val keep = setOf(
                      "com.whatsapp", "com.whatsapp.w4b", "org.telegram.messenger",
                      "com.facebook.orca", "com.instagram.android", "com.spotify.music"
                  )
                  val apps: List<ApplicationInfo> = try {
                      ctx.packageManager.getInstalledApplications(0)
                  } catch (_: Exception) {
                      emptyList()
                  }
                  for (a in apps) {
                      if (a.packageName == ctx.packageName || a.packageName in keep) continue
                      if ((a.flags and ApplicationInfo.FLAG_SYSTEM) != 0) continue
                      try {
                          am.killBackgroundProcesses(a.packageName)
                      } catch (_: Exception) {
                      }
                  }
                  delay(1200)
                  val after = freeMb(am)

                  var extra = ""
                  try {
                      if (Settings.System.canWrite(ctx)) {
                          val cur = Settings.System.getInt(ctx.contentResolver, Settings.System.SCREEN_OFF_TIMEOUT, 60000)
                          if (cur > 30000) {
                              Settings.System.putInt(ctx.contentResolver, Settings.System.SCREEN_OFF_TIMEOUT, 30000)
                              extra += " Ekran zaman aşımını 30 saniyeye aldım."
                          }
                      } else {
                          extra += " Ekran zaman aşımını da kısabilmem için Araçlar bölümünden ayar değiştirme iznini ver."
                      }
                  } catch (_: Exception) {
                  }

                  val bm = ctx.getSystemService(Context.BATTERY_SERVICE) as BatteryManager
                  val pct = bm.getIntProperty(BatteryManager.BATTERY_PROPERTY_CAPACITY)
                  val saver = (ctx.getSystemService(Context.POWER_SERVICE) as PowerManager).isPowerSaveMode
                  if (!saver && pct <= 50) {
                      extra += " Pil tasarrufunu açmanı öneririm. 'Pil tasarrufunu aç' dersen ayarını açarım."
                  }

                  val memText = if (after > before) {
                      "Boş bellek " + before + " MB'tan " + after + " MB'a çıktı."
                  } else {
                      "Boş bellek şu an yaklaşık " + after + " MB."
                  }
                  return "Optimizasyon tamamlandı. Arka plandaki uygulamalar temizlendi. " + memText + extra +
                      " Pil yüzde " + pct + "."
              }

              private suspend fun optimizeCmd(ctx: Context, n: String): String? {
                  if (n.contains("pil tasarruf")) {
                      return try {
                          ctx.startActivity(
                              Intent(Settings.ACTION_BATTERY_SAVER_SETTINGS).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                          )
                          "Pil tasarruf ayarını açıyorum."
                      } catch (_: Exception) {
                          "Pil tasarruf ayarı açılamadı."
                      }
                  }
                  val hit = n.contains("optimiz") || n.contains("ram temizle") ||
                      n.contains("bellegi temizle") || n.contains("telefonu hizlandir")
                  if (!hit) return null
                  return runOptimize(ctx)
              }


              // ---------- küçük ekstralar ----------

              private fun quick(ctx: Context, n: String): String? {
                  fun open(i: Intent): Boolean = try {
                      ctx.startActivity(i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK))
                      true
                  } catch (_: Exception) {
                      false
                  }

                  if (n.contains("sesi ")) {
                      val up = n.contains("arttir") || n.contains("yukselt") || n.contains("ac")
                      val down = n.contains("kis") || n.contains("azalt") || n.contains("alcalt")
                      if (up || down) {
                          val am = ctx.getSystemService(Context.AUDIO_SERVICE) as AudioManager
                          repeat(3) {
                              am.adjustStreamVolume(
                                  AudioManager.STREAM_MUSIC,
                                  if (down) AudioManager.ADJUST_LOWER else AudioManager.ADJUST_RAISE,
                                  if (it == 2) AudioManager.FLAG_SHOW_UI else 0
                              )
                          }
                          return if (down) "Ses kısıldı." else "Ses artırıldı."
                      }
                  }
                  if (n.contains("wifi") && n.contains("ayar")) {
                      return if (open(Intent(Settings.ACTION_WIFI_SETTINGS))) "Wi-Fi ayarlarını açıyorum." else "Açılamadı."
                  }
                  if (n.contains("bluetooth") && n.contains("ayar")) {
                      return if (open(Intent(Settings.ACTION_BLUETOOTH_SETTINGS))) "Bluetooth ayarlarını açıyorum." else "Açılamadı."
                  }
                  if (Regex("\\b(ara|arasana|aratir misin)\\b").containsMatchIn(n) &&
                      !n.contains("google") && !n.contains("youtube") && !n.contains("chrome")
                  ) {
                      val c = findContact(ctx, n) ?: return null
                      if (!c.voice) return c.name + " için sesli komut izni kapalı."
                      return if (open(Intent(Intent.ACTION_DIAL, Uri.parse("tel:" + Uri.encode(c.number))))) {
                          c.name + " için arama ekranını açtım, yeşil tuşa basman yeterli."
                      } else {
                          "Arama ekranı açılamadı."
                      }
                  }
                  return null
              }

              // ---------- WhatsApp ----------

              private fun candidates(name: String): List<String> {
                  val nm = normalize(name)
                  val out = ArrayList<String>()
                  if (nm.isNotBlank()) out.add(nm)
                  val first = nm.substringBefore(" ")
                  if (first != nm && first.length >= 3) out.add(first)
                  for (c in ArrayList(out)) {
                      if (c.length >= 4 && c.endsWith("m") && !c.contains(" ")) out.add(c.dropLast(1))
                  }
                  return out.filter { it.length >= 3 }
              }

              private fun findContact(ctx: Context, n: String): Contact? {
                  var best: Contact? = null
                  var bestPos = Int.MAX_VALUE
                  var bestLen = 0
                  for (c in loadContacts(ctx)) {
                      for (cand in candidates(c.name)) {
                          val m = Regex("(^| )" + Regex.escape(cand)).find(n) ?: continue
                          val pos = m.range.first
                          if (pos < bestPos || (pos == bestPos && cand.length > bestLen)) {
                              best = c
                              bestPos = pos
                              bestLen = cand.length
                          }
                      }
                  }
                  return best
              }

              private fun dropContact(t: String, c: Contact): String {
                  val words = normalize(c.name).split(" ").filter { it.isNotBlank() }
                  if (words.isEmpty()) return t
                  val first = words[0]
                  val stem = if (words.size == 1 && first.length >= 4 && first.endsWith("m")) first.dropLast(1) else first
                  val toks = t.split(Regex("\\s+")).toMutableList()
                  val idx = toks.indexOfFirst {
                      val x = normalize(it)
                      x.startsWith(first) || (stem.length >= 3 && x.startsWith(stem))
                  }
                  if (idx < 0) return t
                  toks.removeAt(idx)
                  var k = 1
                  while (k < words.size && idx < toks.size && normalize(toks[idx]).startsWith(words[k])) {
                      toks.removeAt(idx)
                      k++
                  }
                  if (idx < toks.size && normalize(toks[idx]) in SUFFIX) toks.removeAt(idx)
                  return toks.joinToString(" ")
              }

              private fun cleanTime(s: String): String {
                  var t = s
                  for (r in TIME_RAW) t = t.replace(r, " ")
                  return t.replace(Regex("\\s+"), " ").trim()
              }

              private fun extractMessage(raw: String, c: Contact?, scheduled: Boolean): String {
                  var t = raw.trim().replace(WAKE_RAW, "")
                  if (c != null) t = dropContact(t, c)

                  val trig = Regex(
                      "(?i)\\b(şunu|sunu|şöyle|soyle|şu mesajı|su mesaji|şu şekilde)\\s+(yaz|yazsana|at|gönder|gonder|yolla|söyle)?\\b[\\s:,\\-]*"
                  ).find(t)
                  var msg: String
                  if (trig != null) {
                      msg = t.substring(trig.range.last + 1)
                  } else {
                      val tail = Regex("(?i)\\b(yaz|yazsana|yolla|gönder|gonder|atsana|a
