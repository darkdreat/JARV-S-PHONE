                                      m.text,
                                      color = if (m.fromUser) Color.White else Cyan,
                                      modifier = Modifier.widthIn(max = 300.dp).animateContentSize()
                                          .background(if (m.fromUser) Color(0xCC124052) else Panel, RoundedCornerShape(15.dp))
                                          .border(1.dp, Cyan.copy(alpha = if (m.fromUser) .34f else .2f), RoundedCornerShape(15.dp))
                                          .padding(horizontal = 13.dp, vertical = 10.dp),
                                      fontSize = 14.sp
