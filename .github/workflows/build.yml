              }

              if (showSettings) {
                  var key by remember { mutableStateOf(vm.apiKey) }
                  var model by remember { mutableStateOf(vm.model) }
                  var doublePress by remember { mutableStateOf(vm.doubleVolumeEnabled) }
                  AlertDialog(
                      onDismissRequest = { showSettings = false },
                      containerColor = Color(0xFF071722),
                      title = {
                          Row(verticalAlignment = Alignment.CenterVertically) {
                              Icon(Icons.Filled.Settings, contentDescription = null, tint = Cyan)
                              Spacer(Modifier.width(9.dp))
                              Text("Sistem ayarları", color = Cyan)
                          }
                      },
                      text = {
                          Column(verticalArrangement = Arrangement.spacedBy(10.dp)) {
                              Text("GROQ BAĞLANTISI", color = Muted, fontSize = 10.sp, letterSpacing = 1.5.sp)
                              OutlinedTextField(
                                  value = key, onValueChange = { key = it }, singleLine = true,
                                  label = { Text("API anahtarı", color = Muted) },
                                  visualTransformation = PasswordVisualTransformation(), colors = fieldColors()
