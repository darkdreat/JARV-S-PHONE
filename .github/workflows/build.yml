          JARVIS_B64_EOF
          mkdir -p "app/src/main/res/values"
          cat > "app/src/main/res/values/strings.xml" <<'JARVIS_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">JARVIS Offline</string>
          </resources>
          JARVIS_EOF
          mkdir -p "app/src/main/res/values"
          cat > "app/src/main/res/values/themes.xml" <<'JARVIS_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.Jarvis" parent="android:Theme.Material.NoActionBar">
                  <item name="android:windowBackground">@android:color/black</item>
                  <item name="android:statusBarColor">@android:color/black</item>
                  <item name="android:navigationBarColor">@android:color/black</item>
              </style>
          </resources>
          JARVIS_EOF
          cat > "build.gradle.kts" <<'JARVIS_EOF'
          plugins {
              id("com.android.application") version "8.7.2" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.0.21" apply false
          }
          JARVIS_EOF
          cat > "gradle.properties" <<'JARVIS_EOF'
          org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          JARVIS_EOF
          cat > "settings.gradle.kts" <<'JARVIS_EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "JarvisOffline"
          include(":app")
          JARVIS_EOF

      - name: Java 17 hazirla
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle hazirla
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: APK olustur
        working-directory: jarvis
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --console=plain --stacktrace 2>&1 | tee build.log

      - name: Hata ozeti
        if: failure()
        working-directory: jarvis
        run: |
          {
            echo '## HATA OZETI'
            echo '```'
            grep -E -A6 '^e: |What went wrong|Execution failed|Could not' build.log | head -80
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: APK yukle
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-APK
          path: jarvis/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
