              val t = rememberInfiniteTransition(label = "wave")
              val ph by t.animateFloat(
                  0f, (2 * PI).toFloat(),
                  infiniteRepeatable(tween(1200, easing = LinearEasing)),
                  label = "ph"
              )
              val lv by animateFloatAsState(level, tween(100), label = "wlv")
              Canvas(Modifier.fillMaxWidth().height(34.dp).padding(horizontal = 24.dp)) {
                  val n = 32
                  val gap = size.width / n
                  val cy = size.height / 2f
                  for (i in 0 until n) {
                      val amp = if (active) {
                          (0.2f + 0.8f * abs(sin(ph + i * 0.45f))) * (0.4f + 0.6f * lv)
                      } else {
                          0.08f
                      }
                      val h = size.height * amp
                      val x = gap * i + gap / 2f
                      drawLine(
                          color.copy(alpha = if (active) 0.9f else 0.3f),
                          Offset(x, cy - h / 2f),
                          Offset(x, cy + h / 2f),
                          strokeWidth = 3.dp.toPx(),
                          cap = StrokeCap.Round
                      )
                  }
              }
          }

          @Composable
          fun TypingDots() {
              val tr = rememberInfiniteTransition(label = "dots")
              val ph by tr.animateFloat(
                  0f, (2 * PI).toFloat(),
                  infiniteRepeatable(tween(1000, easing = LinearEasing)),
                  label = "dph"
              )
              Row(Modifier.padding(8.dp), horizontalArrangement = Arrangement.spacedBy(6.dp)) {
                  for (i in 0 until 3) {
                      val a = 0.3f + 0.7f * abs(sin(ph - i * 0.8f))
                      Box(
                          Modifier
                              .size(9.dp)
                              .graphicsLayer {
                                  alpha = a
                                  scaleX = 0.6f + 0.5f * a
                                  scaleY = 0.6f + 0.5f * a
                              }
                              .background(CYAN, CircleShape)
                      )
                  }
              }
          }

          @Composable
          fun Bubble(chat: Chat) {
              val animate = remember(chat) {
                  val a = !chat.user && !chat.played
                  chat.played = true
                  a
              }
              var shown by remember { mutableIntStateOf(if (animate) 0 else chat.text.length) }
              LaunchedEffect(chat) {
                  while (shown < chat.text.length) {
                      delay(14)
                      shown++
                  }
              }
              var vis by remember { mutableStateOf(false) }
              LaunchedEffect(Unit) { vis = true }
              val a by animateFloatAsState(if (vis) 1f else 0f, tween(450), label = "bubble")

              Row(
                  Modifier
                      .fillMaxWidth()
                      .graphicsLayer {
                          alpha = a
                          translationY = (1f - a) * 40f
                      },
                  horizontalArrangement = if (chat.user) Arrangement.End else Arrangement.Start
              ) {
                  Column(
                      Modifier
                          .widthIn(max = 310.dp)
                          .background(
                              if (chat.user) Color(0xFF073B54) else PANEL,
                              RoundedCornerShape(15.dp)
                          )
                          .border(1.dp, CYAN.copy(alpha = 0.25f), RoundedCornerShape(15.dp))
                          .padding(13.dp)
                  ) {
                      Text(
                          if (chat.user) "YOU" else "JARVIS",
                          color = CYAN,
                          fontSize = 9.sp,
                          fontWeight = FontWeight.Bold
                      )
                      Spacer(Modifier.height(5.dp))
                      Text(
                          chat.text.take(shown),
                          color = WHITE,
                          fontSize = 14.sp,
                          lineHeight = 21.sp
                      )
                  }
              }
          }

          @Composable
          fun JarvisApp() {
              val context = LocalContext.current
              val scope = rememberCoroutineScope()
              val prefs = remember { context.getSharedPreferences(PREF, 0) }

              var apiKey by remember { mutableStateOf(prefs.getString("api_key", "") ?: "") }
              var keyInput by remember { mutableStateOf(apiKey) }
              var tab by remember { mutableIntStateOf(0) }
              var input by remember { mutableStateOf("") }
              var busy by remember { mutableStateOf(false) }
              var speakEnabled by remember { mutableStateOf(prefs.getBoolean("speak", true)) }
              var rate by remember { mutableFloatStateOf(prefs.getFloat("rate_f", 1.0f)) }
              var pitch by remember { mutableFloatStateOf(prefs.getFloat("pitch_f", 1.05f)) }
              var nameInput by remember { mutableStateOf(prefs.getString("name", "efendim") ?: "efendim") }
              var savedMessage by remember { mutableStateOf("") }
              var pending by remember { mutableIntStateOf(0) }

              val commands = remember {
                  mutableStateListOf<LocalCommand>().apply { addAll(loadCommands(context)) }
              }
              var trigger by remember { mutableStateOf("") }
              var target by remember { mutableStateOf("") }
              var isUrl by remember { mutableStateOf(true) }

              val speaker = remember { Speaker(context) }
              DisposableEffect(Unit) { onDispose { speaker.shutdown() } }

              LaunchedEffect(Unit) {
                  if (Bus.messages.isEmpty()) {
                      Bus.messages.add(
                          Chat(
                              "Sistem çevrimiçi. Merhaba! Size nasıl yardımcı olabilirim? " +
                                  "Ayarlardan erişilebilirlik kısayolunu açarsanız ses kısma tuşuna iki kez basarak da çağırabilirsiniz.",
                              false
                          )
                      )
                  }
              }

              fun send(raw: String) {
                  val q = raw.trim()
                  if (q.isBlank() || busy) return
                  input = ""
                  busy = true
                  scope.launch {
                      val answer = Brain.respond(context, q)
                      busy = false
                      Bus.state = JState.IDLE
                      if (speakEnabled) speaker.speak(answer) { Bus.state = JState.IDLE }
                  }
              }

              val ears = remember {
                  Ears(
                      context,
                      onPartial = { input = it },
                      onResult = { r ->
                          input = ""
                          send(r)
                      },
                      onFail = {
                          Bus.state = JState.IDLE
                          Bus.level = 0f
                      }
                  )
              }
              DisposableEffect(Unit) { onDispose { ears.destroy() } }

              fun hasMic() = ContextCompat.checkSelfPermission(
                  context, Manifest.permission.RECORD_AUDIO
              ) == PackageManager.PERMISSION_GRANTED

              fun startWakeService() {
                  prefs.edit().putBoolean("always", true).apply()
                  ContextCompat.startForegroundService(
                      context, Intent(context, JarvisService::class.java)
                  )
              }

              fun startMic() {
                  speaker.stop()
                  Bus.state = JState.LISTENING
                  ears.start()
              }

              val perms = rememberLauncherForActivityResult(
                  ActivityResultContracts.RequestMultiplePermissions()
              ) { _ ->
                  if (hasMic()) {
                      if (pending == 1) startWakeService() else startMic()
                  } else {
                      Toast.makeText(context, "Mikrofon izni gerekli", Toast.LENGTH_SHORT).show()
                  }
              }

              fun requireMic(action: Int) {
                  pending = action
                  if (hasMic()) {
                      if (action == 1) startWakeService() else startMic()
                  } else {
                      perms.launch(
                          arrayOf(Manifest.permission.RECORD_AUDIO, Manifest.permission.POST_NOTIFICATIONS)
                      )
                  }
              }

              MaterialTheme(
                  colorScheme = darkColorScheme(
                      primary = CYAN,
                      background = BG,
                      surface = PANEL,
                      onBackground = WHITE,
                      onSurface = WHITE
                  )
              ) {
                  Scaffold(
                      containerColor = BG,
                      bottomBar = {
                          NavigationBar(containerColor = Color(0xFF071120)) {
                              val navColors = NavigationBarItemDefaults.colors(
                                  selectedIconColor = CYAN,
                                  selectedTextColor = CYAN,
                                  indicatorColor = Color(0xFF0A2A3F),
                                  unselectedIconColor = MUTED,
                                  unselectedTextColor = MUTED
                              )
                              NavigationBarItem(
                                  selected = tab == 0,
                                  onClick = { tab = 0 },
                                  icon = { Text("◉", fontSize = 22.sp) },
                                  label = { Text("JARVIS") },
                                  colors = navColors
                              )
                              NavigationBarItem(
                                  selected = tab == 1,
                                  onClick = { tab = 1 },
                                  icon = { Text("🛠", fontSize = 22.sp) },
                                  label = { Text("ARAÇLAR") },
                                  colors = navColors
                              )
                              NavigationBarItem(
                                  selected = tab == 2,
                                  onClick = { tab = 2 },
                                  icon = { Text("⚙", fontSize = 22.sp) },
                                  label = { Text("AYARLAR") },
                                  colors = navColors
                              )
                          }
                      }
                  ) { padding ->
                      Box(Modifier.fillMaxSize().background(BG).padding(padding)) {
                          BackgroundFx()

                          Column(Modifier.fillMaxSize()) {

                              val blink = rememberInfiniteTransition(label = "blink")
