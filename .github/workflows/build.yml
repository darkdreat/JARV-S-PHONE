                              border = BorderStroke(1.dp, Cyan.copy(alpha = .65f)),
                              modifier = Modifier.weight(1f), contentPadding = PaddingValues(5.dp)
                          ) {
                              Icon(Icons.Filled.Image, contentDescription = null, tint = Cyan, modifier = Modifier.size(17.dp))
                              Spacer(Modifier.width(5.dp)); Text("Görsel", color = Cyan, fontSize = 11.sp)
                          }
                          OutlinedButton(
                              onClick = { vm.clearChat() },
                              border = BorderStroke(1.dp, Cyan.copy(alpha = .65f)),
                              modifier = Modifier.weight(1f), contentPadding = PaddingValues(5.dp)
                          ) {
                              Icon(Icons.Filled.DeleteSweep, contentDescription = null, tint = Cyan, modifier = Modifier.size(17.dp))
                              Spacer(Modifier.width(5.dp)); Text("Temizle", color = Cyan, fontSize = 11.sp)
                          }
                      }

                      Row(verticalAlignment = Alignment.CenterVertically) {
                          OutlinedTextField(
                              value = input, onValueChange = { input = it },
                              placeholder = { Text("Komutunuzu yazın...", color = Muted) },
                              modifier = Modifier.weight(1f), singleLine = true,
                              shape = RoundedCornerShape(16.dp), colors = fieldColors()
                          )
                          Button(
                              onClick = { vm.submit(input); input = "" },
                              colors = ButtonDefaults.buttonColors(containerColor = Cyan, contentColor = Color(0xFF001018)),
                              shape = RoundedCornerShape(14.dp), modifier = Modifier.padding(start = 7.dp).height(54.dp)
                          ) { Text("Gönder", fontSize = 12.sp) }
