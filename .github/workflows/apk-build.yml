name: JARVIS APK Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v4

      - name: Java hazirla
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK hazirla
        uses: android-actions/setup-android@v3

      - name: Gradle hazirla
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Android proje dosyalarini olustur
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import sys

          lines = Path(".github/workflows/build.yml").read_text(
              encoding="utf-8"
          ).splitlines()

          marker = "      - name: Android proje dosyalarini olustur"

          if marker not in lines:
              sys.exit("Proje olusturma adimi bulunamadi.")

          i = lines.index(marker)

          if lines[i + 1].strip() != "run: |":
              sys.exit("Workflow formati beklenenden farkli.")

          script = []

          for line in lines[i + 2:]:
              if line.startswith("          "):
                  script.append(line[10:])
              elif not line.strip():
                  script.append("")
              else:
                  break

          while script and not script[-1]:
              script.pop()

          if not script:
              sys.exit("Proje betigi bos.")

          Path("generate-project.sh").write_text(
              "\n".join(script) + "\n",
              encoding="utf-8"
          )
          PY

          bash -e generate-project.sh

      - name: APK derle
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: APK kontrol et
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: APK dosyasini yukle
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
